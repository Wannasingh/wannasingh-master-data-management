# ============================================================
# SonarQube Scanner Configuration — wannasingh-mdm
# Author      : wannasingh-mdm
# Date        : 2026-06-23
# Task/Jira   : MDM-SEC-002
# ============================================================

sonar.projectKey=wannasingh-mdm-app
sonar.projectName=Wannasingh MDM Application
sonar.projectVersion=1.0

# SonarQube server — running on Control Room VM (161.118.199.97)
# Override via SONAR_HOST_URL env var in Jenkins if port differs
sonar.host.url=${SONAR_HOST_URL:-http://161.118.199.97:9000}

# Sources & Tests
sonar.sources=src,api
sonar.tests=src/__tests__,api/tests

# Exclusions (migrations, generated files, node_modules)
sonar.exclusions=\
  src/__tests__/**,\
  api/tests/**,\
  api/migrations/**,\
  node_modules/**,\
  coverage/**,\
  .next/**

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# Language versions
sonar.python.version=3.11

sonar.sourceEncoding=UTF-8

# Quality Gate — pipeline will fail if gate is not passed
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
