# alembic.ini
# ============================================================
# Alembic configuration for wannasingh-mdm
# Task/Jira: MDM-DB-001
# ============================================================

[alembic]
# Path to migration scripts
script_location = api/migrations

# Template to use for new revision files
file_template = %%(rev)s_%%(slug)s

# Sys.path prepend — ensures api package is importable
prepend_sys_path = .

# Timezone for revision timestamps
timezone = Asia/Bangkok

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
