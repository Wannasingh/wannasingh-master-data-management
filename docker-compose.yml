version: "3.8"

# ============================================================
# Docker Compose — wannasingh-mdm
# Author      : wannasingh-mdm
# Date        : 2026-06-23
# Task/Jira   : MDM-DB-001 / MDM-VAULT-001
# Purpose     : Local and Apps VM stack.
#               PostgreSQL replaces Supabase as the primary DB.
#               Credentials are injected via environment at
#               runtime (from Vault in production, .env locally).
# Change Log  :
#   v1.0  2026-06-23  Initial PostgreSQL migration (wannasingh-mdm)
# ============================================================

services:
    # ── FastAPI Backend ───────────────────────────────────────
  # NOTE: PostgreSQL is already running natively on Apps VM.
  #       Connect via DATABASE_URL env var (injected from Vault).
  #       Do NOT add a postgres service here — it would conflict.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "5328:5328"
    environment:
      # Database (injected by Vault Agent or local .env)
      - DATABASE_URL=${DATABASE_URL}
      # Redis
      - REDIS_URL=${REDIS_URL}
      # JWT & Encryption
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - PAYLOAD_ENCRYPTION_KEY=${PAYLOAD_ENCRYPTION_KEY}
      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      # Vault (set in production; leave blank for local dev)
      - VAULT_ADDR=${VAULT_ADDR:-}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
      - VAULT_NAMESPACE=${VAULT_NAMESPACE:-}
      - VAULT_MOUNT_POINT=${VAULT_MOUNT_POINT:-secret}

    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - .:/app

  # ── Redis (Caching) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── Next.js Frontend ──────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api:5328}
      - NEXT_PUBLIC_ENCRYPTION_KEY=${PAYLOAD_ENCRYPTION_KEY}
    depends_on:
      - api

volumes:
  redis_data:
